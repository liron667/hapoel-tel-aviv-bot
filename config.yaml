# Hapoel Tel Aviv (football) news bot. TARGET_CHANNEL_ID env var (or .env) overrides target_channel_id.

target_channel_id: ""      # set via TARGET_CHANNEL_ID secret / .env
lookback_hours: 3
seen_retention_days: 30

# AI post generation (needs GEMINI_API_KEY secret). Falls back to title+link if off/failed.
ai:
  enabled: true
  model: gemini-flash-latest
  team: "הפועל תל אביב"
  hashtags: ["#הפועל_תל_אביב", "#כדורגל"]

telegram_channels: []

rss_feeds:
  - name: ONE
    url: https://www.one.co.il/rss
  - name: "וואלה - כדורגל ישראלי"
    url: https://rss.walla.co.il/feed/156

# Sites without usable RSS: scrape a listing page for article links (title + url).
html_sources:
  - name: Sport5
    url: "https://www.sport5.co.il/world.aspx?FolderID=4439"      # Israeli soccer
    link_regex: 'articles\.aspx\?FolderID=\d+&(?:amp;)?docID=\d+'

# WordPress REST API (JS-rendered sites where scraping fails).
wp_sources:
  - name: "ספורט1"
    url: "https://sport1.maariv.co.il/wp-json/wp/v2/posts?per_page=50"

# An item is posted only if it contains a keyword AND no exclusion.
keywords:
  - "הפועל תל אביב"
  - "הפועל ת\"א"
  - "Hapoel Tel Aviv"

exclusions:
  - "כדורסל"
